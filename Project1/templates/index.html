<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="//maxcdn.bootstrapcdn.com/bootstrap/3.3.2/css/bootstrap.min.css">
    <title>PhotoBook - Cloud Native Development</title>
</head>
<body>
    <h1>Upload an Image</h1>
    <form action="/upload" method="post" enctype="multipart/form-data">
        <input type="file" name="file">
        <input type="submit" value="Upload">
    </form>

   <h2>Uploaded Images</h2>
<ul>
    {% for image in images %}
        <li>
            <!-- Display the image -->
            <img src="/images/{{ image }}" alt="Uploaded Image" style="max-width: 200px;"><br>
            
            <!-- Link to the image file (optional if you don't need it) -->
            <a href="/images/{{ image }}">View Image</a>
            
            <!-- Link to the description file -->
            <p>Description: 
                <a href="/images/{{ image | replace('.jpeg', '.txt') | replace('.jpg', '.txt') | replace('.png', '.txt') }}">
                    {{ image | replace('.jpeg', '.txt') | replace('.jpg', '.txt') | replace('.png', '.txt') }}
                </a>
            </p>
        </li>
    {% endfor %}
</ul>
</body>
</html>
